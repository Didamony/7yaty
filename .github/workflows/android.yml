name: Build Android APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # Signs with the app's own key when the repository secrets are set, so
      # updates install over the previous version and Google sign-in works.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/hayati-release.jks
          cat > android/key.properties <<EOF
          storeFile=hayati-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=hayati
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Firebase settings
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: python3 tool/firebase_defines.py firebase.defines.json

      - name: Build APK
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=BUILD_NUMBER=${{ github.run_number }}
          --dart-define=DIST_REPO=${{ secrets.DIST_TOKEN != '' && 'Didamony/hayati-app' || github.repository }}
          --dart-define-from-file=firebase.defines.json
          --dart-define=ADHAN=${{ hashFiles('android/app/src/main/res/raw/adhan.mp3') != '' && hashFiles('android/app/src/main/res/raw/adhan_fajr.mp3') != '' }}

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk hayati.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hayati-apk
          path: hayati.apk

      - name: Where to publish
        id: dest
        env:
          DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
        # With a DIST_TOKEN, the app goes to the public Didamony/hayati-app
        # repository, so this one (the code) can stay private.
        run: |
          if [ -n "$DIST_TOKEN" ]; then
            echo "external=true" >> "$GITHUB_OUTPUT"
          else
            echo "external=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to the public app repository
        if: steps.dest.outputs.external == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: Didamony/hayati-app
          token: ${{ secrets.DIST_TOKEN }}
          tag_name: build-${{ github.run_number }}
          name: حياتي — نسخة ${{ github.run_number }}
          make_latest: true
          files: hayati.apk
          body: |
            نزّل ملف hayati.apk على الموبايل وافتحه عشان تسطّب التطبيق.

      - name: Publish to Releases
        if: steps.dest.outputs.external != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: حياتي — نسخة ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          # The newest build is "latest", so releases/latest/download works.
          make_latest: true
          files: hayati.apk
          body: |
            نزّل ملف hayati.apk على الموبايل وافتحه عشان تسطّب التطبيق.
            Branch: ${{ github.ref_name }} · Commit: ${{ github.sha }}
