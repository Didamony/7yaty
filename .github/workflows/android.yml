name: Build Android APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # Signs with the app's own key when the repository secrets are set, so
      # updates install over the previous version and Google sign-in works.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/hayati-release.jks
          cat > android/key.properties <<EOF
          storeFile=hayati-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=hayati
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Firebase settings
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: python3 tool/firebase_defines.py firebase.defines.json

      - name: Build APK
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define-from-file=firebase.defines.json

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk hayati.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hayati-apk
          path: hayati.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: حياتي — نسخة ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: hayati.apk
          body: |
            نزّل ملف hayati.apk على الموبايل وافتحه عشان تسطّب التطبيق.
            Branch: ${{ github.ref_name }} · Commit: ${{ github.sha }}
