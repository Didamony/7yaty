name: Fetch adhan recordings

# One-off helper: Wikimedia Commons can't be reached from where the app is
# developed, so this collects freely licensed adhan recordings to choose
# from and commits them to the branch.
on:
  push:
    paths: [tool/fetch_adhan.py, .github/workflows/fetch-adhan.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: python3 tool/fetch_adhan.py
      - name: Commit the candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/adhan-candidates
          git commit -m "Adhan recordings to choose from (Wikimedia Commons)" || exit 0
          git push
